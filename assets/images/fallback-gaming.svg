<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">NEXUS: CONFLICT fallback visual</title>
  <desc id="desc">A stylized fallback image used when remote media fails to load.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="55%" stop-color="#12142a" />
      <stop offset="100%" stop-color="#2b1260" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00d4ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)" />
  <g opacity="0.22">
    <circle cx="210" cy="145" r="140" fill="#00d4ff" />
    <circle cx="1010" cy="560" r="220" fill="#7c3aed" />
  </g>
  <g stroke="url(#line)" stroke-width="2" opacity="0.55">
    <path d="M0 160h1200" />
    <path d="M0 338h1200" />
    <path d="M0 515h1200" />
  </g>
  <g fill="#e8ecff" font-family="Outfit, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="305" font-size="72" font-weight="800" letter-spacing="8">NEXUS: CONFLICT</text>
    <text x="600" y="360" font-size="28" font-weight="500" fill="#9cb3ff">Media preview unavailable</text>
  </g>
</svg>
